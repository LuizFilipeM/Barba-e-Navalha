<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body> 
    {% if messages %}
        <ul style="color: red;">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
    
    <h2>Login</h2>
    <form method="POST">
        {% csrf_token %}
        <label for="email">Email:</label>
        <input type="email" name="email" required><br>

        <label for="senha">Senha:</label>
        <input type="password" name="senha" required><br>

        <br><button type="submit">Login</button>
    </form>

    <br><a href="{% url 'cadastro' %}">Não tem conta? Cadastre-se</a>

    <script>
        function enviarLogin(event) {
            event.preventDefault();

            const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

            const data = {
                email: document.querySelector('[name=email]').value,
                senha: document.querySelector('[name=senha]').value
            };

            fetch("{% url 'login' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                alert(result.message);
                if (result.success) {
                    window.location.href = result.redirect_url || "{% url 'home' %}";
                }
            })
            .catch(error => {
                console.error('Erro:', error);
                alert("Erro ao enviar os dados.");
            });
        }

        document.querySelector('form').addEventListener('submit', enviarLogin);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Teste de Controller REST</title>
</head>
<body>
  <h2>Teste de Funções via Controller</h2>

  <label><input type="checkbox" id="useGet"> Usar GET</label><br><br>

  <button onclick="login()">Login</button>
  <button onclick="cadastro()">Cadastro</button>
  <button onclick="editar()">Editar Perfil</button>
  <button onclick="deletar()">Deletar Perfil</button>
  <hr>
  <button onclick="agendar()">Agendar</button>
  <button onclick="atualizar()">Atualizar Agendamento</button>
  <button onclick="remover()">Remover Agendamento</button>
  <button onclick="listar()">Listar Agendamentos</button>
  <hr>
  <button onclick="obterProximoAgendamento()">Obter Próximo Agendamento e Local</button>
  <button onclick="listarLocaisBarbeiro()">Listar Locais de um Barbeiro</button>
  <button onclick="listarAgendamentosDoBarbeiro()">Listar Agenda do Barbeiro</button>
  <hr>
  <button onclick="listarTodasAsBarbearias()">Listar Todas as Barbearias</button>
  <!-- <button onclick="listarLocaisDoBarbeiro()">Mostrar mapa do local do barbeiro</button> -->

  <pre id="saida"></pre>

  <script>
    const out = document.getElementById("saida");

    function enviar(rota, acao, dados) {
      const useGet = document.getElementById('useGet').checked;

      if (useGet) {
        const query = new URLSearchParams({ acao, ...dados }).toString();
        fetch(`/central/?${query}`)
          .then(res => res.json())
          .then(json => {
            out.textContent = JSON.stringify(json, null, 2);
            if (json.redirect_url) window.location.href = json.redirect_url;
          });
      } else {
        fetch("/central/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ acao, dados })
        })
        .then(res => res.json())
        .then(json => {
          out.textContent = JSON.stringify(json, null, 2);
          if (json.redirect_url) window.location.href = json.redirect_url;
        });
      }
    }

    function login() {
      enviar("/login/", "login", {
        email: "cliente1@example.com",
        senha: "senha123"
      });
    }

    function cadastro() {
      enviar("/cadastro/", "cadastro", {
        nome: "Pedro Barbeiro",
        senha: "senha",
        tipo: "Barbeiro",
        telefone: "1199999978",
        data_nascimento: "1998-05-12",
        email: "novo_cliente2@example.com",
        cidade: "São João del Rei",
        cpf: "12345678901"
      });
    }

    function editar() {
      enviar("/editar_perfil/", "editar_perfil", {

        senha: "senha123",
        email: "cliente1@example.com",
        telefone: "1188888888",
        cidade: "Campinas"
      });
    }

    function deletar() { 
      enviar("/deletar_perfil/", "deletar_perfil", {
        usuario_id: 1
      });
    }

    function agendar() {
      enviar("/agendar/", "inserir_agendamento", {
        cliente: "Luis Felipe",
        barbeiro: "Lucas Barbeiro",
        servico: 11,
        data: "2025-06-14",
        horario: "09:00"
      });
    }


    function atualizar() {
      enviar("/atualizar_agendamento/", "atualiza_agendamento", {
        agendamento_id: 65,
        cliente_id: 6,
        data: "2025-06-11",

        servico: 13
      });
    }

    function remover() {
      enviar("/remover_agendamento/", "remover_agendamento", {
        agendamento_id: 64
      });
    }

    function listar() {
      enviar("/listar_agendamentos/", "listar_agendamentos", {
        cliente: "Luis Felipe"
      });
    }

    // Adicione ao script do seu teste_controller.html
    function obterProximoAgendamento() {
      // Use um nome de cliente que tenha agendamentos futuros
      enviar("/obter_proximo_agendamento/", "obter_proximo_agendamento", {
        cliente_nome: "Luis Felipe" 
      });
    }

    // function listarLocaisBarbeiro() {
    //   // Use um nome de barbeiro que exista e que esteja associado a um ou mais locais.
    //   enviar("/listar_locais_barbeiro/", "listar_locais_barbeiro", {
    //     barbeiro_nome: "Lucas Barbeiro" 
    //   });
    // }
    function listarLocaisBarbeiro() {
      // Esta função agora vai chamar a API, receber o JSON e construir o HTML
      const acao = "listar_locais_barbeiro";
      const dados = { barbeiro_nome: "Lucas Barbeiro" }; // Usa o nome, como a função lógica espera

      // A função 'enviar' faz a chamada da API. Vamos modificar o que acontece depois.
      fetch("/central/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ acao, dados })
      })
      .then(res => res.json())
      .then(json => {
          const out = document.getElementById("saida");
          
          // 1. Exibe o JSON bruto (como antes)
          out.textContent = JSON.stringify(json, null, 2);

          // 2. <<< INÍCIO DA MÁGICA: Constrói o HTML a partir do JSON >>>
          if (json.success && json.resultado && json.resultado.locais) {
              let htmlParaMostrar = `<h2>Locais de Atuação de: ${json.resultado.barbeiro_nome}</h2>`;

              json.resultado.locais.forEach(local => {
                  htmlParaMostrar += `
                      <div style="border: 1px solid #ccc; margin-top: 15px; padding: 10px;">
                          <h3>${local.local_nome}</h3>
                          <p><strong>Endereço:</strong> ${local.endereco}</p>
                          <p><strong>URL do Mapa:</strong> ${local.map_url}</p>
                          <iframe
                              width="100%"
                              height="300"
                              style="border:0;"
                              loading="lazy"
                              src="${local.map_url}">
                          </iframe>
                      </div>
                  `;
              });
              
              // Adiciona o HTML gerado abaixo do JSON bruto
              out.innerHTML += '<hr>' + htmlParaMostrar;
          }
          // <<< FIM DA MÁGICA >>>
      });
    }
    function listarTodasAsBarbearias() {
      // Nenhum dado extra é necessário, apenas a ação
      enviar("/listar_todas_barbearias/", "listar_todas_barbearias", {});
    }

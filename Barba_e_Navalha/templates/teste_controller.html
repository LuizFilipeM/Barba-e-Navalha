  <pre id="saida"></pre>

  <script>
    const out = document.getElementById("saida");

    // MELHORIA 2: Removido o parâmetro 'rota' que não era usado
    function enviar(acao, dados) {
      const checkboxElement = document.getElementById('useGet');
      // Usando a verificação robusta que implementamos antes
      const useGet = checkboxElement ? checkboxElement.checked : false;

      let fetchPromise; // Variável para armazenar a promessa do fetch

      if (useGet) {
        // Para GET, os dados são enviados na URL
        const query = new URLSearchParams({ acao, ...dados }).toString();
        fetchPromise = fetch(`/central/?${query}`);
      } else {
        // Para POST, os dados são enviados no corpo da requisição
        fetchPromise = fetch("/central/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ acao, dados })
        });
      }

      // MELHORIA 1: Lógica centralizada para tratar a resposta e os erros
      fetchPromise
        .then(res => {
          // Se a resposta do servidor não for "OK" (ex: erro 404, 500), lança um erro
          if (!res.ok) {
            throw new Error(`Erro de Servidor: Status ${res.status}`);
          }
          // Tenta converter a resposta para JSON
          return res.json(); 
        })
        .then(json => {
          // Se tudo deu certo, mostra o JSON e redireciona se necessário
          out.textContent = JSON.stringify(json, null, 2);
          if (json.redirect_url) {
            window.location.href = json.redirect_url;
          }
        })
        .catch(err => {
          // Se qualquer etapa anterior falhar, este 'catch' será executado
          console.error("Falha na requisição:", err); // Mostra o erro detalhado no console (F12)
          out.textContent = "Ocorreu um erro ao processar a requisição.\n\n" + err + "\n\nVerifique o console do navegador (F12) para mais detalhes.";
        });
    }

    // As chamadas para enviar() agora não precisam mais do primeiro parâmetro 'rota'
